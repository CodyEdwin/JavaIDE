[package]
name = "javaide-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "javaide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
ide-config = { path = "../../../crates/ide-config" }
ide-gradle = { path = "../../../crates/ide-gradle" }
ide-jdtls = { path = "../../../crates/ide-jdtls" }
ide-opencode = { path = "../../../crates/ide-opencode" }
ide-platform = { path = "../../../crates/ide-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
